---
layout: default
---
<style>
  .post-wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 9rem 4rem 6rem;
  }
  .post-meta {
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }
  .post-meta::before {
    content: '';
    display: block;
    width: 28px;
    height: 1px;
    background: var(--accent);
  }
  .post-title {
    font-family: var(--font-serif);
    font-size: clamp(2rem, 4vw, 3.2rem);
    font-weight: 300;
    line-height: 1.1;
    color: var(--ink);
    margin-bottom: 3rem;
    padding-bottom: 2rem;
    border-bottom: 1px solid var(--border);
  }
  .post-body { color: var(--ink-muted); line-height: 2.1; }
  .post-body h2 {
    font-family: var(--font-serif);
    font-size: 1.6rem;
    font-weight: 400;
    color: var(--ink);
    margin: 2.5rem 0 1rem;
  }
  .post-body h3 {
    font-family: var(--font-serif);
    font-size: 1.2rem;
    color: var(--gold);
    margin: 2rem 0 0.8rem;
  }
  .post-body p { margin-bottom: 1.2rem; font-size: 13px; }
  .post-body a { color: var(--accent-bright); }
  .post-body img {
    width: 100%;
    border: 1px solid var(--border);
    margin: 2rem 0;
  }
  .post-back {
    margin-top: 3rem;
    padding-top: 2rem;
    border-top: 1px solid var(--border);
  }
  @media (max-width: 768px) {
    .post-wrap { padding: 8rem 1.5rem 4rem; }
  }
</style>

<div class="post-wrap">
  <div class="post-meta">{{ page.date | date: "%d %b %Y" }} &nbsp;·&nbsp; {{ page.categories | join: ", " }}</div>
  <h1 class="post-title">{{ page.title }}</h1>
  <div class="post-body">
    {{ content }}
  </div>
  <div class="post-back">
    <a href="/posts" class="btn btn-ghost">← Back to all posts</a>
  </div>
</div>
