---
layout: default
---
<style>
  .post-wrap { max-width:740px; margin:0 auto; padding:9rem 3.5rem 6rem; }
  .post-meta {
    font-size:9px; letter-spacing:.28em; text-transform:uppercase; color:var(--teal);
    margin-bottom:1.5rem; display:flex; align-items:center; gap:.8rem;
  }
  .post-meta::before { content:''; width:20px; height:1px; background:var(--teal); display:block; }
  .post-title {
    font-family:var(--serif); font-size:clamp(2rem,4vw,3.2rem);
    font-weight:400; line-height:1.1; color:var(--ink);
    margin-bottom:3rem; padding-bottom:2rem; border-bottom:1px solid var(--border);
  }
  .post-body { 
    color: var(--muted); 
    font-size: 13px; 
    line-height: 2.2;
    max-width: 720px;
  }
  .post-body h2 { 
    font-family: var(--serif); 
    font-size: 1.8rem; 
    font-weight: 400; 
    color: var(--ink); 
    margin: 2.5rem 0 1rem 0;
    line-height: 1.2;
  }
  .post-body h3 { 
    font-family: var(--serif); 
    font-size: 1.3rem; 
    color: var(--accent-bright); 
    margin: 1.8rem 0 0.8rem 0;
    font-style: italic; 
  }
  .post-body p { 
    margin-bottom: 1.5rem;
    line-height: 2;
  }
  .post-body strong { 
    color: var(--ink); 
    font-weight: 600;
  }
  .post-body em { 
    color: var(--accent-bright); 
    font-style: italic;
  }
  .post-body img { 
    width: 100%; 
    max-width: 600px;
    border: 1px solid var(--border); 
    margin: 2rem 0; 
    display: block; 
  }
  .post-body a { 
    color: var(--teal); 
    text-decoration: underline;
  }
</style>

<div class="post-wrap">
  <div class="post-meta">{{ page.date | date: "%d %b %Y" }} &nbsp;·&nbsp; {{ page.categories | join: " · " }}</div>
  <h1 class="post-title">{{ page.title }}</h1>
  <div class="post-body">{{ content }}</div>
  <div class="post-back">
    <a href="/posts" class="btn btn-outline">← All posts</a>
  </div>
</div>
