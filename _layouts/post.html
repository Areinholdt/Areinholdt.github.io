---
layout: default
---
<style>
  .post-wrap { 
    max-width: 820px; 
    margin: 0 auto; 
    padding: 9rem 3.5rem 6rem;
    position: relative;
    z-index: 1;
  }

  .post-header {
    margin-bottom: 3.5rem;
  }

  .post-meta {
    font-size: 9px; 
    letter-spacing: 0.3em; 
    text-transform: uppercase; 
    color: var(--accent);
    margin-bottom: 1.5rem; 
    display: flex; 
    align-items: center; 
    gap: 0.8rem;
  }

  .post-meta::before { 
    content: ''; 
    width: 28px; 
    height: 1px; 
    background: var(--accent); 
    display: block; 
  }

  .post-title {
    font-family: var(--serif); 
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 300; 
    line-height: 1.1; 
    color: var(--ink);
    margin-bottom: 3rem;
    padding-bottom: 2.5rem;
    border-bottom: 1px solid var(--border);
  }

  .post-body { 
    color: var(--ink-muted); 
    font-size: 12.5px; 
    line-height: 2.1;
    margin-bottom: 3rem;
  }

  .post-body h2 { 
    font-family: var(--serif); 
    font-size: 1.5rem; 
    font-weight: 400; 
    color: var(--ink); 
    margin: 3rem 0 1.5rem;
    line-height: 1.2;
  }

  .post-body h3 { 
    font-family: var(--serif); 
    font-size: 1.1rem; 
    color: var(--accent-bright); 
    margin: 2rem 0 1rem;
    font-style: italic; 
    font-weight: 400;
  }

  .post-body p { 
    margin-bottom: 1.5rem;
  }

  .post-body strong { 
    color: var(--ink); 
    font-weight: 600;
  }

  .post-body em { 
    color: var(--accent-bright); 
    font-style: italic;
  }

  .post-body img { 
    width: 100%; 
    border: 1px solid var(--border); 
    margin: 2rem 0; 
    display: block; 
  }

  .post-body a { 
    color: var(--teal); 
    text-decoration: underline;
  }

  .post-body a:hover {
    opacity: 0.8;
  }

  .post-body ul,
  .post-body ol {
    margin-bottom: 1.5rem;
    margin-left: 2rem;
    line-height: 2;
  }

  .post-body li {
    margin-bottom: 0.8rem;
  }

  .post-back {
    margin-top: 4rem;
    padding-top: 2.5rem;
    border-top: 1px solid var(--border);
  }

  .post-back a {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    text-decoration: none;
  }

  .post-back a:hover {
    color: var(--accent-bright);
  }

  @media (max-width: 768px) {
    .post-wrap { 
      padding: 8rem 2rem 4rem; 
    }

    .post-title {
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      margin-bottom: 2rem;
    }

    .post-body {
      font-size: 12px;
    }

    .post-body h2 {
      margin: 2rem 0 1rem;
    }
  }
</style>

<div class="post-wrap">
  <div class="post-header">
    <div class="post-meta">{{ page.date | date: "%d %b %Y" }} {% if page.categories %} · {{ page.categories | join: " · " }}{% endif %}</div>
    <h1 class="post-title">{{ page.title }}</h1>
  </div>
  
  <div class="post-body">
    {{ content }}
  </div>
  
  <div class="post-back">
    <a href="/posts">← Back to all posts</a>
  </div>
</div>
