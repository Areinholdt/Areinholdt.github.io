<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #e8edf4;
      --ink-muted: #8fa3bc;
      --ink-faint: #4a607a;
      --bg: #050d18;
      --bg-surface: #0a1628;
      --bg-card: #0f1f35;
      --accent: #3a8fc4;
      --accent-glow: #1a5f8a;
      --accent-bright: #7ec8e3;
      --gold: #c8a96e;
      --border: rgba(58,143,196,0.18);
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-mono: 'DM Mono', monospace;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 300;
      line-height: 1.8;
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 15% 10%, rgba(18,60,100,0.4) 0%, transparent 55%),
        radial-gradient(ellipse 60% 80% at 85% 90%, rgba(10,40,80,0.45) 0%, transparent 55%),
        radial-gradient(ellipse 100% 100% at 50% 50%, rgba(3,15,35,0.6) 0%, transparent 80%);
      pointer-events: none;
      z-index: 0;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.2rem 4rem;
      background: rgba(5,13,24,0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo {
      font-family: var(--font-serif);
      font-size: 1.05rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      color: var(--accent-bright);
      text-decoration: none;
    }
    .nav-links {
      display: flex;
      gap: 2.5rem;
      list-style: none;
    }
    .nav-links a {
      color: var(--ink-muted);
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--accent-bright); }

    /* MAIN */
    main { position: relative; z-index: 1; }

    /* PAGE HEADER (for inner pages) */
    .page-header {
      padding: 10rem 4rem 4rem;
      max-width: 900px;
      margin: 0 auto;
    }
    .page-eyebrow {
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .page-eyebrow::before {
      content: '';
      display: block;
      width: 28px;
      height: 1px;
      background: var(--accent);
    }
    .page-title {
      font-family: var(--font-serif);
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 300;
      line-height: 1.1;
      color: var(--ink);
    }
    .page-title em {
      font-style: italic;
      color: var(--accent-bright);
    }

    /* CONTENT AREA */
    .content-area {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 4rem 6rem;
    }

    /* FOOTER */
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2.5rem 2rem;
      border-top: 1px solid var(--border);
      color: var(--ink-faint);
      font-size: 11px;
      letter-spacing: 0.1em;
    }
    footer a { color: var(--ink-faint); text-decoration: none; }
    footer a:hover { color: var(--accent-bright); }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      nav { padding: 1rem 1.5rem; }
      .nav-links { gap: 1.5rem; }
      .page-header { padding: 8rem 1.5rem 2rem; }
      .content-area { padding: 1.5rem 1.5rem 4rem; }
    }

    /* UTILITIES */
    .section-label {
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 2.5rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
      max-width: 160px;
    }
    .btn {
      display: inline-block;
      padding: 0.7rem 1.8rem;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: var(--accent);
      color: #050d18;
      font-weight: 400;
    }
    .btn-primary:hover { background: var(--accent-bright); }
    .btn-ghost {
      background: transparent;
      color: var(--ink-muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent-bright); }
  </style>
  {% if page.extra_css %}{{ page.extra_css }}{% endif %}
</head>
<body>

<nav>
  <a href="/" class="nav-logo">A. Reinholdt</a>
  <ul class="nav-links">
    <li><a href="/about">About</a></li>
    <li><a href="/research">Research</a></li>
    <li><a href="/posts">Blog</a></li>
    <li><a href="/cv">CV</a></li>
    <li><a href="/contact">Contact</a></li>
  </ul>
</nav>

<main>
  {{ content }}
</main>

<footer>
  <p>© {{ 'now' | date: "%Y" }} Annika Caroline Reinholdt &nbsp;·&nbsp; Marine Genomics &nbsp;·&nbsp;
  <a href="mailto:ozreinholdt@gmail.com">ozreinholdt@gmail.com</a></p>
</footer>

</body>
</html>
