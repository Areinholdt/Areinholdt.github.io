<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #02080f;
      --bg2:     #040e1c;
      --bg3:     #061528;
      --surface: #071b34;
      --card:    #0a2040;
      --border:  rgba(80,160,220,0.12);
      --border2: rgba(80,160,220,0.22);
      --ink:     #d4e8f8;
      --muted:   #6a96ba;
      --faint:   #2a4a6a;
      --accent:  #4da6e0;
      --bright:  #8fd4f5;
      --teal:    #3ecfb0;
      --gold:    #d4a85a;
      --serif:   'Playfair Display', Georgia, serif;
      --mono:    'Space Mono', monospace;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.8;
      min-height: 100vh;
    }

    /* PARTICLES */
    #particles {
      position: fixed; inset:0;
      pointer-events: none; z-index:0; overflow:hidden;
    }
    .p {
      position: absolute; border-radius:50%;
      background: rgba(78,170,230,0.35);
      animation: drift linear infinite;
    }
    @keyframes drift {
      0%   { transform: translateY(100vh) translateX(0); opacity:0; }
      10%  { opacity:1; }
      90%  { opacity:.4; }
      100% { transform: translateY(-80px) translateX(var(--dx,20px)); opacity:0; }
    }

    /* NAV */
    nav {
      position: fixed; top:0; left:0; right:0; z-index:200;
      display: flex; align-items:center; justify-content:space-between;
      padding: 1.1rem 3.5rem;
      background: rgba(2,8,15,0.92);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .nav-logo {
      font-family: var(--serif); font-size:1rem; font-weight:400;
      color: var(--bright); text-decoration:none; letter-spacing:.06em;
    }
    .nav-logo em { font-style:italic; color:var(--teal); }
    nav ul { display:flex; gap:2rem; list-style:none; }
    nav a { color:var(--muted); text-decoration:none; font-size:10px; letter-spacing:.2em; text-transform:uppercase; transition:color .2s; }
    nav a:hover { color:var(--bright); }

    /* MAIN */
    main { position:relative; z-index:1; }

    /* INNER PAGE HEADER */
    .page-header {
      padding: 9rem 3.5rem 4rem;
      max-width: 1100px; margin:0 auto;
    }
    .eyebrow {
      font-size:9px; letter-spacing:.35em; text-transform:uppercase;
      color:var(--teal); margin-bottom:1.2rem;
      display:flex; align-items:center; gap:.7rem;
    }
    .eyebrow::before { content:''; width:20px; height:1px; background:var(--teal); display:block; }
    .page-title {
      font-family: var(--serif);
      font-size: clamp(2.5rem, 4.5vw, 4rem);
      font-weight:400; line-height:1.08; color:var(--ink);
    }
    .page-title em { font-style:italic; color:var(--bright); }

    /* CONTENT */
    .content-wrap {
      max-width: 1100px; margin:0 auto;
      padding: 2rem 3.5rem 6rem;
    }

    /* SHARED UTILITIES */
    .section-label {
      font-size:9px; letter-spacing:.3em; text-transform:uppercase; color:var(--accent);
      margin-bottom:2.5rem; display:flex; align-items:center; gap:.8rem;
    }
    .section-label::after { content:''; flex:1; height:1px; background:var(--border); max-width:120px; }

    .btn {
      display:inline-block; padding:.65rem 1.6rem;
      font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
      text-decoration:none; border:none; cursor:pointer; transition:all .2s;
    }
    .btn-primary { background:var(--accent); color:#02080f; font-weight:700; }
    .btn-primary:hover { background:var(--bright); }
    .btn-outline { background:transparent; color:var(--muted); border:1px solid var(--border2); }
    .btn-outline:hover { border-color:var(--accent); color:var(--bright); }

    /* FOOTER */
    footer {
      position:relative; z-index:1; text-align:center;
      padding:2.5rem 2rem; border-top:1px solid var(--border);
      color:var(--faint); font-size:10px; letter-spacing:.1em;
    }
    footer a { color:var(--faint); text-decoration:none; }
    footer a:hover { color:var(--accent); }

    @media (max-width:768px) {
      nav { padding:1rem 1.5rem; }
      nav ul { gap:1.2rem; }
      .page-header { padding:8rem 1.5rem 2rem; }
      .content-wrap { padding:1.5rem 1.5rem 4rem; }
    }
  </style>
</head>
<body>

<div id="particles"></div>

<nav>
  <a href="/about" class="nav-logo">A. <em>Reinholdt</em></a>
  <ul>
    <li><a href="/about">About</a></li>
    <li><a href="/research">Research</a></li>
    <li><a href="/posts">Blog</a></li>
    <li><a href="/cv">CV</a></li>
    <li><a href="/contact">Contact</a></li>
  </ul>
</nav>

<main>{{ content }}</main>

<footer>
  <p>© {{ 'now' | date: "%Y" }} Annika Caroline Reinholdt &nbsp;·&nbsp; Marine Genomics &nbsp;·&nbsp;
  <a href="mailto:annika.reinholdt@sund.ku.dk">annika.reinholdt@sund.ku.dk</a></p>
</footer>

<script>
  (function(){
    var c = document.getElementById('particles');
    for(var i=0;i<28;i++){
      var p=document.createElement('div'); p.className='p';
      var s=Math.random()*3+1;
      p.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(Math.random()*100)+'%;bottom:-'+(Math.random()*10+5)+'%;animation-duration:'+(Math.random()*18+12)+'s;animation-delay:'+(Math.random()*12)+'s;--dx:'+(( Math.random()-.5)*80)+'px;opacity:'+(Math.random()*.5+.1)+';';
      c.appendChild(p);
    }
  })();
</script>
</body>
</html>
